<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vereinsverwaltung</title>
    <style>
        :root{--c:#1a5fb4;--b:#ddd}
        *{box-sizing:border-box}
        body{font:16px system-ui,sans-serif;margin:0;padding-bottom:70px;background:#f6f7f9;color:#222}
        header{background:var(--c);color:#fff;padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center}
        main{max-width:640px;margin:0 auto;padding:1rem}
        nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--b)}
        nav button{flex:1;border:0;border-radius:0;background:none;padding:.8rem .1rem;font-size:.78rem}
        nav button.on{color:var(--c);font-weight:700;border-top:3px solid var(--c)}
        input,select,button{font:inherit;padding:.65rem;min-height:44px;border:1px solid #bbb;border-radius:6px;background:#fff;max-width:100%}
        button.p{background:var(--c);color:#fff;border-color:var(--c)}
        button.d{color:#b00020}
        form,.card{background:#fff;border:1px solid var(--b);border-radius:8px;padding:.8rem;margin-bottom:.8rem;display:flex;flex-direction:column;gap:.5rem}
        .row{display:flex;flex-direction:row;gap:.5rem;align-items:center}.row>*{min-width:0}.row>span{flex:1}
        table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:.5rem;border-bottom:1px solid var(--b);text-align:left}.n{text-align:right}
        canvas{width:100%;height:auto;border:1px dashed #888;border-radius:6px;touch-action:none}
        .msg{padding:.6rem;border-radius:6px;margin-bottom:.8rem}.err{background:#fde7ea;color:#b00020}.ok{background:#e3f6e8;color:#14632b}
        .tabs{display:flex;gap:.3rem;margin-bottom:.8rem}.tabs button{flex:1;font-size:.85rem}.tabs .on{background:var(--c);color:#fff}
        header select{min-height:36px;padding:.3rem;max-width:60%}
        nav{overflow-x:auto}nav button{flex:1 0 auto;padding:.8rem .7rem}
        .lnk{border:0;background:none;color:var(--c);padding:0;min-height:0;text-align:left;font-weight:600;text-decoration:underline}
        [hidden]{display:none!important}
    </style>
</head>
<body>
<header><b id="title">Vereinsverwaltung</b><select id="club" hidden></select><button id="out" hidden>Logout</button></header>
<main id="m"></main>
<nav id="nav" hidden></nav>
<script>
    const API = 'https://DEINE-HETZNER-DOMAIN/api';   // ohne Slash am Ende
    const store = localStorage;                        // sessionStorage: Login endet mit dem Tab
    const E = {invalid_credentials:'E-Mail oder Passwort falsch', invalid_code:'Code oder E-Mail ungültig bzw. abgelaufen',
        email_taken:'E-Mail ist bereits vergeben', invalid_email:'E-Mail ungültig', invalid_password:'Passwort mindestens 8 Zeichen',
        duplicate:'Eintrag existiert bereits', no_stock:'Kein Bestand beim Verein', player_has_none:'Spieler hat dieses Stück nicht',
        player_holds_items:'Spieler hält noch Kleidungsstücke', item_held:'Stück ist noch bei Spielern',
        qty_below_held:'Stückzahl kleiner als bei Spielern', too_many_attempts:'Zu viele Versuche, bitte später erneut',
        invalid_signature:'Unterschrift fehlt', unauthorized:'Bitte neu einloggen', no_club:'Kein Verein zugeordnet', invalid_token:'Link ungültig oder abgelaufen', invalid_photo:'Foto ungültig', cannot_remove_self:'Du kannst dich nicht selbst entfernen'};
    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let me = null, tab = 'ov', lt = 'login', dir = 'to_player', msg = null, D = {items:[], players:[], officials:[]};
    let H = {rows:[], more:false, pf:''}, sel = null, PH = {};
    let RESET = (location.hash.match(/^#reset=([0-9a-f]{64})$/) || [])[1] || null; if (RESET) lt = 'reset';
    const flash = (t, c = 'ok') => msg = {h: esc(t), c};

    async function api(p, m = 'GET', b) {
        const t = store.getItem('tok');
        const r = await fetch(API + p, {method: m, body: b ? JSON.stringify(b) : undefined,
            headers: {...(b ? {'Content-Type':'application/json'} : {}), ...(t ? {Authorization:'Bearer ' + t, 'X-Club': store.getItem('club') || ''} : {})}});
        const d = await r.json().catch(() => ({}));
        if (r.status === 401 && t) { store.removeItem('tok'); me = null; }
        if (!r.ok) throw new Error(E[d.error] || d.error || r.status);
        return d;
    }
    const load = async () => [D.items, D.players, D.officials] = await Promise.all([api('/items'), api('/players'), api('/officials')]);
    const loadMe = async () => { me = await api('/me'); store.setItem('club', me.id); };
    async function hist(more) {
        const last = more && H.rows.length ? '&before=' + H.rows[H.rows.length - 1].id : '';
        const r = await api(`/handovers?player_id=${H.pf || 0}${last}`);
        H.rows = more ? H.rows.concat(r) : r; H.more = r.length == 50;
    }
    const go = fn => fn().catch(e => { msg = {h: esc(e.message), c:'err'}; render(); });

    function pad(c) {
        const x = c.getContext('2d'); let d = false;
        const clear = () => { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.strokeStyle = '#000'; x.lineWidth = 3; x.lineCap = 'round'; c.dirty = false; };
        const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
        c.onpointerdown = e => { d = true; c.setPointerCapture(e.pointerId); x.beginPath(); x.moveTo(...pt(e)); };
        c.onpointermove = e => { if (!d) return; x.lineTo(...pt(e)); x.stroke(); c.dirty = true; };
        c.onpointerup = c.onpointercancel = () => d = false;
        c.clear = clear; clear();
    }

    function fillItems() {
        const p = D.players.find(x => x.id == $('#hp').value);
        const o = dir == 'to_player' ? D.items.filter(i => i.at_club > 0).map(i => [i.id, `${i.name} ${i.size} (${i.at_club} frei)`])
            : (p ? p.holdings.map(h => [h.item_id, `${h.name} ${h.size} (${h.qty})`]) : []);
        $('#hi').innerHTML = '<option value="">Kleidungsstück wählen</option>' + o.map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join('');
    }
    function showCode(n, c) { msg = {h: `Code für ${esc(n)}: <b>${esc(c)}</b><br><small>Einmalig verwendbar, 7 Tage gültig, wird nur jetzt angezeigt.</small>`, c:'ok'}; }

    const vLogin = () => {
        const f = {
            login: `<input name=email type=email placeholder="E-Mail" required autocomplete=username><input name=password type=password placeholder="Passwort" required autocomplete=current-password><button class=p>Einloggen</button><button type=button data-lt=forgot>Passwort vergessen?</button>`,
            join: `<input name=code placeholder="Einladungscode" required autocapitalize=characters><input name=email type=email placeholder="E-Mail" required><input name=password type=password minlength=8 placeholder="Passwort (mind. 8 Zeichen)" required><small>Gleiche E-Mail wie ein bestehender Zugang? Dann bestehendes Passwort eingeben.</small><button class=p>Beitreten</button>`,
            club: `<input name=club_name placeholder="Vereinsname" required><input name=name placeholder="Dein Name" required><input name=email type=email placeholder="E-Mail" required><input name=password type=password minlength=8 placeholder="Passwort (mind. 8 Zeichen)" required><small>Gleiche E-Mail wie ein bestehender Zugang? Dann bestehendes Passwort eingeben.</small><button class=p>Verein anlegen</button>`,
            forgot: `<input name=email type=email placeholder="E-Mail" required><button class=p>Link zum Zurücksetzen senden</button>`,
            reset: `<input name=password type=password minlength=8 placeholder="Neues Passwort (mind. 8 Zeichen)" required autocomplete=new-password><button class=p>Passwort setzen</button>`}[lt];
        return `<div class=tabs>${[['login','Einloggen'],['join','Beitreten'],['club','Neuer Verein']].map(([k, l]) => `<button data-lt=${k} class="${lt == k ? 'on' : ''}">${l}</button>`).join('')}</div><form id=auth>${f}</form>`;
    };
    const vOv = () => `<table><tr><th>Kleidungsstück<th class=n>Verein<th class=n>Spieler<th class=n>Gesamt</tr>${
        D.items.map(i => `<tr><td><button class=lnk data-item=${i.id}>${esc(i.name)} ${esc(i.size)}</button><td class=n>${i.at_club}<td class=n>${i.at_players}<td class=n>${i.total_qty}</tr>`).join('') || '<tr><td colspan=4>Noch keine Kleidungsstücke</tr>'}</table>`;
    const vHo = () => `<form id=ho>
  <div class=tabs><button type=button data-dir=to_player class="${dir == 'to_player' ? 'on' : ''}">An Spieler</button><button type=button data-dir=to_club class="${dir == 'to_club' ? 'on' : ''}">Zurück an Verein</button></div>
  <select id=hp required><option value="">Spieler wählen</option>${D.players.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
  <select id=hi required></select>
  <div id=sg ${dir == 'to_club' ? 'hidden' : ''}><small>Unterschrift des Spielers</small><canvas id=cv width=600 height=220></canvas><button type=button data-act=clr>Unterschrift löschen</button></div>
  <button class=p>Übergabe speichern</button></form>`;
    const vHv = () => `<select id=hf style="width:100%;margin-bottom:.8rem"><option value="">Alle Spieler</option>${D.players.map(p => `<option value="${p.id}" ${p.id == H.pf ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` +
        (H.rows.map(x => `<div class=card><div class=row><b style="flex:1">${x.direction == 'to_player' ? 'Ausgabe an' : 'Rückgabe von'} ${esc(x.player_name)}</b>${x.has_sig ? `<button data-act=sig data-id=${x.id}>Unterschrift</button>` : ''}</div>
  <span>${esc(x.item_name)} ${esc(x.item_size)}</span><small>${new Date(x.created_at).toLocaleString('de-DE')} · ${esc(x.official_name)}</small><div id=s${x.id}></div></div>`).join('') || '<p>Noch keine Übergaben</p>') +
        (H.more ? '<button data-act=more style="width:100%">Mehr laden</button>' : '');
    const vDet = () => {
        const i = D.items.find(x => x.id == sel), who = D.players.filter(p => p.holdings.some(x => x.item_id == i.id));
        return `<button data-act=back>← Zurück</button><div class=card style="margin-top:.8rem"><b style="font-size:1.1rem">${esc(i.name)} ${esc(i.size)}</b>
  <small>Verein ${i.at_club} · bei Spielern ${i.at_players} · gesamt ${i.total_qty}</small>
  ${i.has_photo ? (PH[i.id] ? `<img alt="Foto" src="${PH[i.id]}" style="width:100%;border-radius:6px">` : '<small>Foto wird geladen …</small>') : '<small>Kein Foto hinterlegt</small>'}
  <div class=row><input type=file id=pf accept="image/*" hidden><button data-act=photo>${i.has_photo ? 'Foto ändern' : 'Foto hinzufügen'}</button>${i.has_photo ? '<button class=d data-act=phdel>Foto entfernen</button>' : ''}</div></div>
  <div class=card><b>Aktuell bei Spielern</b>${who.map(p => `<div class=row><span>${esc(p.name)}</span><b>${p.holdings.find(x => x.item_id == i.id).qty}×</b></div>`).join('') || '<small>Bei keinem Spieler</small>'}</div>`;
    };
    const toJpeg = file => new Promise((res, rej) => {
        const img = new Image(), u = URL.createObjectURL(file);
        img.onload = () => {
            const k = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement('canvas'), x = c.getContext('2d');
            c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = () => rej(new Error('Bild konnte nicht gelesen werden'));
        img.src = u;
    });
    const vPl = () => `<form id=pa class=row><input name=name placeholder="Name des Spielers" required style="flex:1"><button class=p>Anlegen</button></form>` +
        D.players.map(p => `<div class=card><div class=row><b style="flex:1">${esc(p.name)}</b><button data-act=pedit data-id=${p.id}>Ändern</button><button class=d data-act=pdel data-id=${p.id}>Löschen</button></div>
  <small>${p.holdings.map(h => `${h.qty}× ${esc(h.name)} ${esc(h.size)}`).join(', ') || 'nichts ausgegeben'}</small></div>`).join('');
    const vIt = () => `<form id=ia><input name=name placeholder="Bezeichnung (z. B. Trikot)" required><div class=row><input name=size placeholder="Größe" required style="flex:1"><input name=total_qty type=number min=0 value=1 required style="width:90px"></div><button class=p>Anlegen</button></form>` +
        D.items.map(i => `<div class=card><button class=lnk data-item=${i.id}>${esc(i.name)} ${esc(i.size)}${i.has_photo ? ' 📷' : ''}</button><small>Verein ${i.at_club} · bei Spielern ${i.at_players}</small>
  <div class=row><input type=number min=${i.at_players} value=${i.total_qty} id=q${i.id} style="width:90px"><button data-act=isave data-id=${i.id}>Stückzahl speichern</button><button class=d data-act=idel data-id=${i.id} ${i.at_players ? 'disabled' : ''}>Löschen</button></div></div>`).join('');
    const vOf = () => `<form id=oa><input name=name placeholder="Name" required><input name=email type=email placeholder="E-Mail" required><button class=p>Funktionär anlegen und Code erzeugen</button></form>` +
        D.officials.map(o => `<div class=card><div class=row><span><b>${esc(o.name)}</b><br><small>${esc(o.email)} · ${o.active ? 'aktiv' : 'eingeladen'}</small></span>${o.active ? '' : `<button data-act=ocode data-id=${o.id}>Neuer Code</button>`}${o.id == me.id ? '' : `<button class=d data-act=orem data-id=${o.id}>Entfernen</button>`}</div></div>`).join('') +
        `<form id=pw><b>Mein Passwort ändern</b><input name=old_password type=password placeholder="Aktuelles Passwort" required autocomplete=current-password><input name=password type=password minlength=8 placeholder="Neues Passwort (mind. 8 Zeichen)" required autocomplete=new-password><button class=p>Passwort ändern</button></form>`;

    function render() {
        $('#out').hidden = $('#nav').hidden = !me;
        const multi = me && me.clubs.length > 1;
        $('#title').hidden = multi; $('#club').hidden = !multi;
        $('#title').textContent = me ? me.club_name : 'Vereinsverwaltung';
        if (multi) $('#club').innerHTML = me.clubs.map(c => `<option value="${c.id}" ${c.id == me.id ? 'selected' : ''}>${esc(c.club_name)}</option>`).join('');
        const h = msg ? `<div class="msg ${msg.c}">${msg.h}</div>` : ''; msg = null;
        if (!me) { $('#m').innerHTML = h + vLogin(); return; }
        $('#nav').innerHTML = [['ov','Übersicht'],['ho','Übergabe'],['hv','Verlauf'],['pl','Spieler'],['it','Kleidung'],['of','Funktionäre']]
            .map(([k, l]) => `<button data-tab=${k} class="${tab == k ? 'on' : ''}">${l}</button>`).join('');
        if (sel && !D.items.some(x => x.id == sel)) sel = null;
        $('#m').innerHTML = h + (sel ? vDet() : {ov:vOv, ho:vHo, hv:vHv, pl:vPl, it:vIt, of:vOf}[tab]());
        if (tab == 'ho') { pad($('#cv')); fillItems(); }
    }

    document.addEventListener('change', e => {
        if (e.target.id == 'hp') fillItems();
        else if (e.target.id == 'club') go(async () => { store.setItem('club', e.target.value); await loadMe(); await load(); H = {rows:[], more:false, pf:''}; sel = null; if (tab == 'hv') await hist(); render(); });
        else if (e.target.id == 'pf') go(async () => { const f = e.target.files[0]; if (!f) return; const d = await toJpeg(f); await api(`/items/${sel}/photo`, 'PUT', {photo: d}); PH[sel] = d; await load(); render(); });
        else if (e.target.id == 'hf') go(async () => { H.pf = e.target.value; await hist(); render(); });
    });
    document.addEventListener('submit', e => { e.preventDefault(); const f = e.target, d = Object.fromEntries(new FormData(f)); go(async () => {
        if (f.id == 'auth' && lt == 'forgot') { await api('/forgot', 'POST', d); lt = 'login'; flash('Falls zu dieser E-Mail ein Zugang existiert, wurde ein Link verschickt.'); }
        else if (f.id == 'auth' && lt == 'reset') { await api('/reset', 'POST', {token: RESET, password: d.password}); RESET = null; history.replaceState(null, '', location.pathname); lt = 'login'; flash('Passwort geändert, bitte einloggen.'); }
        else if (f.id == 'auth') { const r = await api({login:'/login', join:'/join', club:'/clubs'}[lt], 'POST', d); store.setItem('tok', r.token); if (r.official_id) store.setItem('club', r.official_id); await loadMe(); await load(); H = {rows:[], more:false, pf:''}; sel = null; tab = 'ov'; }
        else if (f.id == 'pa') { await api('/players', 'POST', d); await load(); flash('Spieler angelegt'); }
        else if (f.id == 'ia') { d.total_qty = +d.total_qty; await api('/items', 'POST', d); await load(); flash('Kleidungsstück angelegt'); }
        else if (f.id == 'oa') { const r = await api('/officials', 'POST', d); await load(); showCode(d.name, r.code); }
        else if (f.id == 'pw') { await api('/password', 'POST', d); flash('Passwort geändert, andere Geräte wurden abgemeldet'); }
        else if (f.id == 'ho') {
            const cv = $('#cv'); if (dir == 'to_player' && !cv.dirty) throw new Error(E.invalid_signature);
            await api('/handovers', 'POST', {player_id: +$('#hp').value, item_id: +$('#hi').value, direction: dir, signature: dir == 'to_player' ? cv.toDataURL('image/png') : undefined});
            await load(); flash('Übergabe gespeichert');
        }
        render(); }); });
    document.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return; const a = b.dataset;
        if (a.lt) { lt = a.lt; render(); }
        else if (a.tab) { tab = a.tab; sel = null; if (tab == 'hv') go(async () => { await hist(); render(); }); else render(); }
        else if (a.dir) { dir = a.dir; document.querySelectorAll('[data-dir]').forEach(x => x.classList.toggle('on', x.dataset.dir == dir)); $('#sg').hidden = dir == 'to_club'; fillItems(); }
        else if (b.id == 'out') { api('/logout', 'POST').catch(() => {}); store.removeItem('tok'); me = null; render(); }
        else if (a.act == 'clr') $('#cv').clear();
        else if (a.act == 'back') { sel = null; render(); }
        else if (a.act == 'photo') $('#pf').click();
        else if (a.item) { sel = +a.item; render(); const i = D.items.find(x => x.id == sel);
            if (i && i.has_photo && !PH[sel]) go(async () => { const id = sel, r = await api(`/items/${id}/photo`); PH[id] = r.photo; if (sel == id) render(); }); }
        else if (a.act) go(async () => {
            if (a.act == 'more') { await hist(true); render(); return; }
            if (a.act == 'sig') { const box = $('#s' + a.id); if (box.innerHTML) { box.innerHTML = ''; return; }
                const r = await api(`/handovers/${a.id}/signature`); box.innerHTML = `<img alt="Unterschrift" src="${r.signature}" style="width:100%;border:1px solid #ddd">`; return; }
            if (a.act == 'phdel') { if (!confirm('Foto entfernen?')) return; await api(`/items/${sel}/photo`, 'DELETE'); delete PH[sel]; flash('Foto entfernt'); }
            if (a.act == 'orem') { if (!confirm('Funktionär wirklich entfernen?')) return; await api('/officials/' + a.id, 'DELETE'); flash('Funktionär entfernt'); }
            if (a.act == 'pedit') { const n = prompt('Neuer Name', D.players.find(x => x.id == a.id).name); if (!n || !n.trim()) return; await api('/players/' + a.id, 'PUT', {name: n}); }
            if (a.act == 'pdel') { if (!confirm('Spieler wirklich löschen?')) return; await api('/players/' + a.id, 'DELETE'); }
            if (a.act == 'isave') { await api('/items/' + a.id, 'PUT', {total_qty: +$('#q' + a.id).value}); flash('Gespeichert'); }
            if (a.act == 'idel') { if (!confirm('Kleidungsstück wirklich löschen?')) return; await api('/items/' + a.id, 'DELETE'); }
            if (a.act == 'ocode') { const r = await api(`/officials/${a.id}/code`, 'POST'); showCode(D.officials.find(x => x.id == a.id).name, r.code); }
            await load(); render();
        });
    });
    (async () => { if (store.getItem('tok') && !RESET) { try { await loadMe(); await load(); } catch (e) {} } render(); })();
</script>
</body>
</html>
